version: "3.8"

services:
  # PostgreSQL for leader node
  leaderpostgres:
    image: postgres:14.13
    container_name: test-leaderpostgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drb_leader
    ports:
      - "15432:5432"
    volumes:
      - test-leaderpostgres-data:/var/lib/postgresql/data
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL for regular node 1
  regular1postgres:
    image: postgres:14.13
    container_name: test-regular1postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drb_regular1
    ports:
      - "15433:5432"
    volumes:
      - test-regular1postgres-data:/var/lib/postgresql/data
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL for regular node 2
  regular2postgres:
    image: postgres:14.13
    container_name: test-regular2postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drb_regular2
    ports:
      - "15434:5432"
    volumes:
      - test-regular2postgres-data:/var/lib/postgresql/data
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL for regular node 3
  regular3postgres:
    image: postgres:14.13
    container_name: test-regular3postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drb_regular3
    ports:
      - "15435:5432"
    volumes:
      - test-regular3postgres-data:/var/lib/postgresql/data
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Leader Node
  leadernode:
    build:
      context: ..
      dockerfile: test/Dockerfile
    container_name: test-leadernode
    depends_on:
      leaderpostgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_TYPE: leader
      LEADER_PORT: ${LEADER_PORT}
      ETH_RPC_URLS: ${ETH_RPC_URLS}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      CHAIN_ID: 1337
      LEADER_PRIVATE_KEY: ${LEADER_PRIVATE_KEY}
      EOA_PRIVATE_KEY: ${LEADER_PRIVATE_KEY}
      DISABLE_MERKLE_ROOT_SUBMISSION: ${DISABLE_MERKLE_ROOT_SUBMISSION}
      MOCK_GENERATE_RANDOM_NUMBER: ${MOCK_GENERATE_RANDOM_NUMBER}
      LEADER_EOA: ${LEADER_EOA}
      POSTGRES_HOST: leaderpostgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_NAME: drb_leader
      OFF_CHAIN_SUBMISSION_PERIOD: 40
      REQUEST_OR_SUBMIT_OR_FAIL_DECISION_PERIOD: 30
      ON_CHAIN_SUBMISSION_PERIOD: 60
      OFF_CHAIN_SUBMISSION_PERIOD_PER_OPERATOR: 20
      ON_CHAIN_SUBMISSION_PERIOD_PER_OPERATOR: 30
    volumes:
      - ../test/static-key:/app/static-key
    ports:
      - "${LEADER_PORT}:${LEADER_PORT}"
    networks:
      - test-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${LEADER_PORT} || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: on-failure

  # Regular Node 1
  regularnode1:
    build:
      context: ..
      dockerfile: test/Dockerfile
    container_name: test-regularnode1
    depends_on:
      regular1postgres:
        condition: service_healthy
      leadernode:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_TYPE: regular
      REGULAR_NODE_NUMBER: "1"
      REGULAR_PEER_ID: ${REGULAR1_PEER_ID}
      LEADER_IP: leadernode
      LEADER_PORT: ${LEADER_PORT}
      LEADER_PEER_ID: ${LEADER_PEER_ID}
      PORT: ${REGULAR1_PORT}
      ETH_RPC_URLS: ${ETH_RPC_URLS}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      CHAIN_ID: 1337
      LEADER_EOA: ${LEADER_EOA}
      POSTGRES_HOST: regular1postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_NAME: drb_regular1
      EOA_PRIVATE_KEY: ${REGULAR1_PRIVATE_KEY}
      MOCK_SEND_COMMIT_TO_LEADER: ${MOCK_SEND_COMMIT_TO_LEADER}
      MOCK_SEND_COS_TO_LEADER: ${MOCK_SEND_COS_TO_LEADER}
      MOCK_SEND_SECRET_TO_LEADER: ${MOCK_SEND_SECRET_TO_LEADER}
      DISABLE_COS_SUBMISSION: ${DISABLE_COS_SUBMISSION}
      DISABLE_SECRET_SUBMISSION: ${DISABLE_SECRET_SUBMISSION}
      OFF_CHAIN_SUBMISSION_PERIOD: 40
      REQUEST_OR_SUBMIT_OR_FAIL_DECISION_PERIOD: 30
      ON_CHAIN_SUBMISSION_PERIOD: 60
      OFF_CHAIN_SUBMISSION_PERIOD_PER_OPERATOR: 20
      ON_CHAIN_SUBMISSION_PERIOD_PER_OPERATOR: 30
    volumes:
      - ../test/static-key:/app/static-key
    ports:
      - "${REGULAR1_PORT}:${REGULAR1_PORT}"
    networks:
      - test-net
    restart: on-failure

  # Regular Node 2
  regularnode2:
    build:
      context: ..
      dockerfile: test/Dockerfile
    container_name: test-regularnode2
    depends_on:
      regular2postgres:
        condition: service_healthy
      leadernode:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_TYPE: regular
      REGULAR_NODE_NUMBER: "2"
      REGULAR_PEER_ID: ${REGULAR2_PEER_ID}
      LEADER_IP: leadernode
      LEADER_PORT: ${LEADER_PORT}
      LEADER_PEER_ID: ${LEADER_PEER_ID}
      PORT: ${REGULAR2_PORT}
      ETH_RPC_URLS: ${ETH_RPC_URLS}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      CHAIN_ID: 1337
      LEADER_EOA: ${LEADER_EOA}
      POSTGRES_HOST: regular2postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_NAME: drb_regular2
      EOA_PRIVATE_KEY: ${REGULAR2_PRIVATE_KEY}
      MOCK_SEND_COMMIT_TO_LEADER: ${MOCK_SEND_COMMIT_TO_LEADER}
      MOCK_SEND_COS_TO_LEADER: ${MOCK_SEND_COS_TO_LEADER}
      OFF_CHAIN_SUBMISSION_PERIOD: 40
      REQUEST_OR_SUBMIT_OR_FAIL_DECISION_PERIOD: 30
      ON_CHAIN_SUBMISSION_PERIOD: 60
      OFF_CHAIN_SUBMISSION_PERIOD_PER_OPERATOR: 20
      ON_CHAIN_SUBMISSION_PERIOD_PER_OPERATOR: 30
    volumes:
      - ../test/static-key:/app/static-key
    ports:
      - "${REGULAR2_PORT}:${REGULAR2_PORT}"
    networks:
      - test-net
    restart: on-failure

  # Regular Node 3
  regularnode3:
    build:
      context: ..
      dockerfile: test/Dockerfile
    container_name: test-regularnode3
    depends_on:
      regular3postgres:
        condition: service_healthy
      leadernode:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_TYPE: regular
      REGULAR_NODE_NUMBER: "3"
      REGULAR_PEER_ID: ${REGULAR3_PEER_ID}
      LEADER_IP: leadernode
      LEADER_PORT: ${LEADER_PORT}
      LEADER_PEER_ID: ${LEADER_PEER_ID}
      PORT: ${REGULAR3_PORT}
      ETH_RPC_URLS: ${ETH_RPC_URLS}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      CHAIN_ID: 1337
      LEADER_EOA: ${LEADER_EOA}
      POSTGRES_HOST: regular3postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_NAME: drb_regular3
      EOA_PRIVATE_KEY: ${REGULAR3_PRIVATE_KEY}
      MOCK_SEND_COMMIT_TO_LEADER: ${MOCK_SEND_COMMIT_TO_LEADER}
      MOCK_SEND_COS_TO_LEADER: ${MOCK_SEND_COS_TO_LEADER}
      OFF_CHAIN_SUBMISSION_PERIOD: 40
      REQUEST_OR_SUBMIT_OR_FAIL_DECISION_PERIOD: 30
      ON_CHAIN_SUBMISSION_PERIOD: 60
      OFF_CHAIN_SUBMISSION_PERIOD_PER_OPERATOR: 20
      ON_CHAIN_SUBMISSION_PERIOD_PER_OPERATOR: 30
    volumes:
      - ../test/static-key:/app/static-key
    ports:
      - "${REGULAR3_PORT}:${REGULAR3_PORT}"
    networks:
      - test-net
    restart: on-failure

volumes:
  test-leaderpostgres-data:
  test-regular1postgres-data:
  test-regular2postgres-data:
  test-regular3postgres-data:

networks:
  test-net:
    driver: bridge

